<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSISOCHUKWU – Cinematic WebGL</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aa8866;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #ffaa3355;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1s;
            backdrop-filter: blur(4px);
        }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,200,150,0.15);
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="loading">⚡ INITIALIZING CINEMATIC SEQUENCE ⚡</div>
    <div class="info">KOSISOCHUKWU • 7s loop</div>

    <!-- Import maps and Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // --- ERROR LOGGING HELPER ---
        window.addEventListener('error', (e) => console.error('Global error:', e.message));
        console.log('🚀 Starting KOSISOCHUKWU sequence');

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';

        // --- Configuration ---
        const SCENE_DURATION = 7.0;
        const PARTICLE_COUNT = 3800; // slightly more for canvas-sampled density
        const DUST_COUNT = 800;

        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.03);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- Post Processing (Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.6;
        bloomPass.radius = 0.8;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lighting ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const keyLight = new THREE.DirectionalLight(0xccaa88, 1.2);
        keyLight.position.set(2, 5, 3);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.6);
        fillLight.position.set(-3, 1, 2);
        scene.add(fillLight);
        
        // Point light inside stone
        const stoneGlowLight = new THREE.PointLight(0xffaa33, 2, 8, 2);
        stoneGlowLight.position.set(0, 0.2, 0);
        scene.add(stoneGlowLight);
        
        // Additional lights for text
        const textGlowLight1 = new THREE.PointLight(0xffaa00, 1, 10);
        textGlowLight1.position.set(1, 1, 2);
        scene.add(textGlowLight1);
        const textGlowLight2 = new THREE.PointLight(0x3377ff, 0.8, 10);
        textGlowLight2.position.set(-1, -0.5, 2);
        scene.add(textGlowLight2);

        // --- Helper: noise texture for stone ---
        function createNoiseTexture(width = 64, height = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = Math.floor(Math.random() * 256);
                data[i] = val; data[i+1] = val; data[i+2] = val; data[i+3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- 1. Ancient Stone Tablet ---
        const stoneGeo = new THREE.BoxGeometry(2.2, 1.2, 0.8, 64, 64, 64);
        const stoneMat = new THREE.MeshStandardMaterial({
            color: 0x6a5e4e,
            emissive: 0x221100,
            roughness: 0.7,
            metalness: 0.1,
            displacementMap: createNoiseTexture(128, 128),
            displacementScale: 0.3,
            displacementBias: -0.1,
            map: (() => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#6a5e4e';
                ctx.fillRect(0, 0, 256, 256);
                for (let i = 0; i < 500; i++) {
                    ctx.fillStyle = `rgba(80,70,60,${Math.random()*0.3})`;
                    ctx.beginPath();
                    ctx.arc(Math.random()*256, Math.random()*256, Math.random()*5, 0, 2*Math.PI);
                    ctx.fill();
                }
                return new THREE.CanvasTexture(canvas);
            })(),
            emissiveMap: createNoiseTexture(128, 128),
        });
        const stone = new THREE.Mesh(stoneGeo, stoneMat);
        stone.position.set(0, 0, 0);
        scene.add(stone);
        stoneGlowLight.position.copy(stone.position);

        // --- 2. Dust Particles (ambient) ---
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(DUST_COUNT * 3);
        for (let i = 0; i < DUST_COUNT; i++) {
            const r = 5 + Math.random() * 8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            dustPositions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            dustPositions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r * 0.5;
            dustPositions[i*3+2] = Math.cos(phi) * r;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0x88aacc,
            size: 0.08,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            map: (() => {
                const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(8, 8, 6, 0, 2*Math.PI); ctx.fill();
                return new THREE.CanvasTexture(canvas);
            })(),
            depthWrite: false
        });
        const dustParticles = new THREE.Points(dustGeo, dustMat);
        scene.add(dustParticles);

        // --- 3. Main Symbol Particles (will become the text) ---
        const particleGeo = new THREE.BufferGeometry();
        const initialPositions = new Float32Array(PARTICLE_COUNT * 3);
        const particleColors = new Float32Array(PARTICLE_COUNT * 3);
        // Random positions on stone surface
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const face = Math.floor(Math.random() * 6);
            let x, y, z;
            const u = Math.random() * 2 - 1;
            const v = Math.random() * 2 - 1;
            const halfW = 1.1, halfH = 0.6, halfD = 0.4;
            switch(face) {
                case 0: x = halfW; y = v * halfH; z = u * halfD; break;
                case 1: x = -halfW; y = v * halfH; z = u * halfD; break;
                case 2: x = u * halfW; y = halfH; z = v * halfD; break;
                case 3: x = u * halfW; y = -halfH; z = v * halfD; break;
                case 4: x = u * halfW; y = v * halfH; z = halfD; break;
                case 5: x = u * halfW; y = v * halfH; z = -halfD; break;
            }
            x += (Math.random() - 0.5) * 0.2;
            y += (Math.random() - 0.5) * 0.2;
            z += (Math.random() - 0.5) * 0.2;
            initialPositions[i*3] = x;
            initialPositions[i*3+1] = y;
            initialPositions[i*3+2] = z;
            
            // goldish
            particleColors[i*3] = 1.0;
            particleColors[i*3+1] = 0.7 + Math.random()*0.3;
            particleColors[i*3+2] = 0.2 + Math.random()*0.2;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(initialPositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleTexture = (() => {
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(16, 16, 12, 0, 2*Math.PI); ctx.fill();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.arc(16, 16, 8, 0, 2*Math.PI); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        })();

        const particleMat = new THREE.PointsMaterial({
            size: 0.15,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true
        });
        const symbolParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(symbolParticles);

        // Storage for target positions and swirl offsets
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const swirlOffsets = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            swirlOffsets[i*3] = (Math.random() - 0.5) * 4;
            swirlOffsets[i*3+1] = (Math.random() - 0.5) * 4;
            swirlOffsets[i*3+2] = (Math.random() - 0.5) * 4;
        }

        // --- 4. Fallback: Generate text particle targets from Canvas 2D (guaranteed to work) ---
        function generateCanvasTextTargets() {
            console.log('Generating canvas-based text targets (fallback)');
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 180px "Arial", "Helvetica", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('KOSISOCHUKWU', canvas.width/2, canvas.height/2);
            
            // Sample points where image is white
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const positions = [];
            const step = 2; // sample every 2nd pixel for performance/ density
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    if (data[index] > 128) {
                        // Map to 3D space: x: -1.8..1.8, y: -0.6..0.6, z small range
                        const px = (x / canvas.width) * 3.6 - 1.8;
                        const py = -(y / canvas.height) * 1.2 + 0.6; // flip y
                        const pz = (Math.random() - 0.5) * 0.3;
                        positions.push(px, py, pz);
                    }
                }
            }
            console.log(`Sampled ${positions.length/3} points from canvas`);
            
            // If we have fewer than needed, repeat some
            const targetArray = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const srcIdx = (i % (positions.length/3)) * 3;
                targetArray[i*3] = positions[srcIdx] + (Math.random()-0.5)*0.1;
                targetArray[i*3+1] = positions[srcIdx+1] + (Math.random()-0.5)*0.1;
                targetArray[i*3+2] = positions[srcIdx+2] + (Math.random()-0.5)*0.1;
            }
            return targetArray;
        }

        // Default fallback targets (populated immediately)
        const fallbackTargets = generateCanvasTextTargets();
        // Copy to targetPositions as initial (will be overwritten if font succeeds)
        for (let i = 0; i < PARTICLE_COUNT*3; i++) {
            targetPositions[i] = fallbackTargets[i];
        }

        // --- 5. Attempt to load 3D Font for better text mesh ---
        let textMesh = null;
        let textTargetsReady = false; // becomes true only when font targets are set

        const loader = new FontLoader();
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', (font) => {
            console.log('✅ 3D Font loaded, creating text geometry and precise targets');
            const textGeo = new THREE.TextGeometry('KOSISOCHUKWU', {
                font: font,
                size: 1.2,
                height: 0.25,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: 0.05,
                bevelSize: 0.03,
                bevelOffset: 0,
                bevelSegments: 5
            });
            textGeo.center();
            
            const textMat = new THREE.MeshStandardMaterial({
                color: 0xffaa33,
                emissive: 0xaa4400,
                roughness: 0.3,
                metalness: 0.8,
                emissiveIntensity: 1.2
            });
            textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.position.set(0, 0.1, 0);
            textMesh.visible = false;
            scene.add(textMesh);

            // Sample vertices for particle targets
            const posAttr = textGeo.attributes.position;
            const vertexCount = posAttr.count;
            const positions = posAttr.array;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = Math.floor(Math.random() * vertexCount) * 3;
                targetPositions[i*3] = positions[idx];
                targetPositions[i*3+1] = positions[idx+1];
                targetPositions[i*3+2] = positions[idx+2];
            }
            // Add slight noise
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                targetPositions[i*3] += (Math.random() - 0.5) * 0.15;
                targetPositions[i*3+1] += (Math.random() - 0.5) * 0.15;
                targetPositions[i*3+2] += (Math.random() - 0.5) * 0.15;
            }
            
            textTargetsReady = true;
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
        }, undefined, (err) => {
            console.warn('⚠️ Font loading failed, using canvas-based targets. Text mesh will not appear, but particles will form the name.', err);
            // fallback already in targetPositions
            textTargetsReady = true; // still true so animation proceeds
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
        });

        // If font takes too long, we still have fallback, but we need to set textTargetsReady true after a timeout
        // But we already have fallback targets, so we can set a timeout to force ready if font never returns
        setTimeout(() => {
            if (!textTargetsReady) {
                console.log('⚠️ Font load timeout, using fallback targets');
                textTargetsReady = true;
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
            }
        }, 3000);

        // --- Stars background ---
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1500 * 3);
        for (let i = 0; i < 1500; i++) {
            const r = 15 + Math.random() * 20;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            starPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            starPos[i*3+2] = Math.cos(phi) * r;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x88aadd, size: 0.15, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- Camera motion ---
        function updateCamera(time) {
            const t = (time % SCENE_DURATION) / SCENE_DURATION;
            const startPos = new THREE.Vector3(2, 1.5, 6);
            const endPos = new THREE.Vector3(0.2, 0.5, 2.2);
            const orbitOffset = new THREE.Vector3(
                Math.sin(time * 0.5) * 0.3,
                Math.cos(time * 0.3) * 0.1,
                0
            );
            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            camera.position.lerpVectors(startPos, endPos, eased);
            camera.position.add(orbitOffset);
            camera.lookAt(0, 0.2, 0);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = performance.now() / 1000;
            const tCycle = (elapsedTime % SCENE_DURATION) / SCENE_DURATION;

            updateCamera(elapsedTime);

            // Drift dust
            const dustPos = dustParticles.geometry.attributes.position.array;
            for (let i = 0; i < DUST_COUNT; i++) {
                const idx = i * 3;
                dustPos[idx] += Math.sin(elapsedTime * 0.5 + i) * 0.0005;
                dustPos[idx+1] += Math.cos(elapsedTime * 0.3 + i) * 0.0003;
                dustPos[idx+2] += Math.sin(elapsedTime * 0.4 + i*2) * 0.0004;
                if (dustPos[idx] > 12) dustPos[idx] = -12;
                if (dustPos[idx+1] > 8) dustPos[idx+1] = -8;
            }
            dustParticles.geometry.attributes.position.needsUpdate = true;

            // Update particles if targets are ready
            if (textTargetsReady) {
                const positions = symbolParticles.geometry.attributes.position.array;
                const colors = symbolParticles.geometry.attributes.color.array;

                // Determine phase
                let phase = 1, phaseT = 0;
                if (tCycle < 0.28) { phase = 1; phaseT = tCycle / 0.28; }
                else if (tCycle < 0.57) { phase = 2; phaseT = (tCycle - 0.28) / 0.29; }
                else if (tCycle < 0.85) { phase = 3; phaseT = (tCycle - 0.57) / 0.28; }
                else { phase = 4; phaseT = (tCycle - 0.85) / 0.15; }

                // Show text mesh only in phase 4 (if it exists)
                if (textMesh) {
                    textMesh.visible = (phase === 4);
                    if (phase === 4) {
                        textMesh.material.emissiveIntensity = 1.0 + Math.sin(elapsedTime * 10) * 0.3;
                        textMesh.scale.setScalar(1.0 + Math.sin(elapsedTime * 20) * 0.02);
                    }
                }

                // Update each particle
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const i3 = i * 3;
                    const ix = initialPositions[i3];
                    const iy = initialPositions[i3+1];
                    const iz = initialPositions[i3+2];
                    
                    const tx = targetPositions[i3];
                    const ty = targetPositions[i3+1];
                    const tz = targetPositions[i3+2];

                    let px, py, pz;

                    if (phase === 1) {
                        px = ix; py = iy; pz = iz;
                        const pulse = 0.8 + 0.4 * Math.sin(elapsedTime * 8 + i);
                        colors[i3] = 1.0;
                        colors[i3+1] = 0.7 * pulse;
                        colors[i3+2] = 0.2;
                    } else if (phase === 2) {
                        // lift and swirl
                        px = ix + swirlOffsets[i3] * phaseT;
                        py = iy + swirlOffsets[i3+1] * phaseT * 1.5;
                        pz = iz + swirlOffsets[i3+2] * phaseT;
                        colors[i3] = 0.3 + phaseT * 0.7;
                        colors[i3+1] = 0.8 + phaseT * 0.2;
                        colors[i3+2] = 1.0;
                    } else if (phase === 3) {
                        // assemble to target
                        const startX = ix + swirlOffsets[i3];
                        const startY = iy + swirlOffsets[i3+1] * 1.5;
                        const startZ = iz + swirlOffsets[i3+2];
                        const eased = phaseT; // linear
                        px = startX * (1 - eased) + tx * eased;
                        py = startY * (1 - eased) + ty * eased;
                        pz = startZ * (1 - eased) + tz * eased;
                        if (phaseT < 0.3) {
                            px += Math.sin(elapsedTime * 50 + i) * 0.2 * (0.3 - phaseT);
                        }
                        colors[i3] = 1.0;
                        colors[i3+1] = 0.6 + 0.4 * Math.sin(elapsedTime * 30 + i);
                        colors[i3+2] = 0.1 + 0.2 * Math.sin(elapsedTime * 20 + i);
                    } else {
                        // phase 4: final sparks around text
                        const angle = elapsedTime * 2 + i;
                        px = tx + Math.sin(angle) * 0.3 * (1 - phaseT);
                        py = ty + Math.cos(angle*1.3) * 0.3 * (1 - phaseT);
                        pz = tz + Math.sin(angle*0.7) * 0.3 * (1 - phaseT);
                        colors[i3] = 1.0;
                        colors[i3+1] = 0.9;
                        colors[i3+2] = 0.6;
                    }
                    positions[i3] = px;
                    positions[i3+1] = py;
                    positions[i3+2] = pz;
                }
                symbolParticles.geometry.attributes.position.needsUpdate = true;
                symbolParticles.geometry.attributes.color.needsUpdate = true;
            }

            // Animate lights
            stoneGlowLight.intensity = 1.5 + Math.sin(elapsedTime * 6) * 1.0;
            bloomPass.strength = 1.5 + Math.sin(elapsedTime * 5) * 0.3;

            composer.render();
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Initialization complete, waiting for font or fallback.');
    </script>
</body>
</html>
